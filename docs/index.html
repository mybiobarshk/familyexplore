<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Flowpath unifies your complete wellness tools so your crew can focus on real progress." />
  <title>flowpath — Bridge the gaps</title>
  <link rel="preconnect" href="https://db.onlinewebfonts.com" />
  <link href="https://db.onlinewebfonts.com/c/08e020de1811ec4489f82d1247a42c09?family=Helvetica+Now+Text" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    * { font-family: "Helvetica Now Text", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .liquid-glass {
      background: rgba(255, 255, 255, 0.01);
      background-blend-mode: luminosity;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: none;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
    }
    .liquid-glass::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(180deg,
        rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.15) 20%,
        rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%,
        rgba(255,255,255,0.15) 80%, rgba(255,255,255,0.45) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }
    @keyframes dropdown-in {
      from { opacity: 0; transform: translateY(-4px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .animate-dropdown { animation: dropdown-in 0.2s ease-out; }
    .duration-400 { transition-duration: 400ms; }
  </style>
</head>
<body class="m-0 bg-[#2C221C]">
  <div id="root"></div>
  <script type="module">
    import React, { useState } from "https://esm.sh/react@19.2.0";
    import { createRoot } from "https://esm.sh/react-dom@19.2.0/client";
    import { ChevronDown, Menu, X } from "https://esm.sh/lucide-react@0.468.0?external=react";

    const h = React.createElement;
    const navigation = [
      { label: "Product", items: ["Connections", "Workflows", "Insights"] },
      { label: "Solutions", items: ["Guides", "Use cases", "API reference"] },
      { label: "About", items: ["Our story", "Open roles", "Reach us"] },
      { label: "Plans" },
    ];

    function Logo() {
      return h("a", { href: "#", className: "relative z-20 flex items-center gap-2.5 text-white", "aria-label": "flowpath home" },
        h("svg", { width: 28, height: 28, viewBox: "0 0 28 28", fill: "none", "aria-hidden": "true" },
          h("path", { d: "M14 1.75 26.25 14 14 26.25 1.75 14 14 1.75Z", fill: "white", opacity: "0.9" }),
          h("path", { d: "M14 6.5 21.5 14 14 21.5 6.5 14 14 6.5Z", fill: "#2C221C", opacity: "0.5" })
        ),
        h("span", { className: "text-lg sm:text-xl font-medium tracking-tight" }, "flowpath")
      );
    }

    function DesktopNav() {
      const [open, setOpen] = useState(null);
      return h("div", { className: "hidden md:flex items-center gap-7 lg:gap-9" },
        navigation.map((item) => h("div", {
          key: item.label,
          className: "relative",
          onMouseEnter: () => item.items && setOpen(item.label),
          onMouseLeave: () => setOpen(null)
        },
          h("button", { className: "flex items-center gap-1 text-white/90 hover:text-white text-sm font-medium transition-colors", type: "button" },
            item.label,
            item.items && h(ChevronDown, { className: `h-3.5 w-3.5 transition-transform duration-300 ${open === item.label ? "rotate-180" : ""}` })
          ),
          item.items && open === item.label && h("div", { className: "liquid-glass !absolute top-full left-0 mt-3 rounded-xl py-3 px-2 min-w-[160px] shadow-xl animate-dropdown" },
            item.items.map((sub) => h("a", { key: sub, href: "#", className: "block px-3 py-2 text-white/80 hover:text-white text-sm rounded-lg hover:bg-white/5 transition-colors" }, sub))
          )
        ))
      );
    }

    function MobileMenu({ open }) {
      return h("div", { className: `md:hidden absolute left-5 right-5 sm:left-6 sm:right-6 top-full z-20 bg-[#2C221C]/95 backdrop-blur-xl rounded-2xl p-6 transition-all duration-400 ease-[cubic-bezier(0.16,1,0.3,1)] ${open ? "opacity-100 translate-y-2 visible" : "opacity-0 -translate-y-4 invisible pointer-events-none"}` },
        h("div", { className: "space-y-5" }, navigation.map((item) => h("div", { key: item.label },
          h("a", { href: "#", className: "text-white text-base font-medium" }, item.label),
          item.items && h("div", { className: "mt-3 ml-4 space-y-2 border-l border-white/10 pl-4" },
            item.items.map((sub) => h("a", { key: sub, href: "#", className: "block text-white/65 hover:text-white text-sm transition-colors" }, sub))
          )
        ))),
        h("div", { className: "mt-6 pt-5 border-t border-white/10 flex items-center justify-between" },
          h("a", { href: "#", className: "text-white/90 hover:text-white text-sm font-medium" }, "Log in"),
          h("a", { href: "#", className: "liquid-glass rounded-full px-5 py-2 text-white text-sm font-medium" }, h("span", { className: "relative z-10" }, "Try it free"))
        )
      );
    }

    function App() {
      const [mobileOpen, setMobileOpen] = useState(false);
      return h("section", { className: "relative h-screen w-full overflow-hidden flex flex-col" },
        h("video", {
          className: "absolute inset-0 h-full w-full object-cover",
          src: "https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260703_053131_1ec3dd1c-d627-44fb-ab20-6e1fce41b0d5.mp4",
          autoPlay: true, muted: true, loop: true, playsInline: true
        }),
        h("div", { className: "absolute inset-0 bg-black/10" }),
        h("nav", { className: "relative z-20 w-full px-5 sm:px-6 md:px-12 lg:px-16 py-4 sm:py-5" },
          h("div", { className: "flex items-center justify-between" },
            h(Logo),
            h(DesktopNav),
            h("div", { className: "hidden md:flex items-center gap-5" },
              h("a", { href: "#", className: "text-white/90 hover:text-white text-sm font-medium transition-colors" }, "Log in"),
              h("a", { href: "#", className: "liquid-glass rounded-full px-5 py-2 text-white text-sm font-medium hover:bg-white/5 transition-colors" }, h("span", { className: "relative z-10" }, "Try it free"))
            ),
            h("button", { className: "md:hidden relative z-20 h-10 w-10 text-white", onClick: () => setMobileOpen(!mobileOpen), type: "button", "aria-label": mobileOpen ? "Close menu" : "Open menu", "aria-expanded": mobileOpen },
              h(Menu, { className: `absolute inset-2 h-6 w-6 transition-all duration-300 ${mobileOpen ? "rotate-90 scale-75 opacity-0" : "rotate-0 scale-100 opacity-100"}` }),
              h(X, { className: `absolute inset-2 h-6 w-6 transition-all duration-300 ${mobileOpen ? "rotate-0 scale-100 opacity-100" : "-rotate-90 scale-75 opacity-0"}` })
            )
          ),
          h(MobileMenu, { open: mobileOpen })
        ),
        h("div", { className: "relative z-10 flex-1 flex items-start justify-center px-5 pt-16 sm:pt-20 md:pt-24" },
          h("div", { className: "text-center max-w-3xl" },
            h("h1", { className: "text-white text-3xl sm:text-4xl md:text-5xl lg:text-6xl xl:text-7xl leading-[1.05] tracking-[-0.02em]" },
              "Bridge the", h("br"), "gaps. ", h("span", { className: "text-white/60" }, "Ditch the"), h("br"), h("span", { className: "text-white/60" }, "grindwork.")
            ),
            h("p", { className: "text-white/80 text-sm sm:text-base md:text-lg leading-relaxed max-w-md mx-auto mt-6 sm:mt-8" }, "Flowpath unifies your complete wellness tools, so your crew spends less energy plugging gaps and more on real progress."),
            h("div", { className: "flex flex-wrap items-center justify-center gap-3 sm:gap-4 mt-6 sm:mt-8" },
              h("a", { href: "#", className: "px-5 sm:px-6 py-2.5 sm:py-3 bg-white text-gray-900 text-sm font-semibold rounded-full hover:bg-white/90 transition-colors" }, "Begin your journey"),
              h("a", { href: "#", className: "px-5 sm:px-6 py-2.5 sm:py-3 liquid-glass rounded-full text-white text-sm font-semibold hover:bg-white/10 transition-colors" }, h("span", { className: "relative z-10" }, "See it live"))
            )
          )
        )
      );
    }

    createRoot(document.getElementById("root")).render(h(App));
  </script>
</body>
</html>
