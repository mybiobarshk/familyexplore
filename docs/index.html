<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="用幾分鐘整理感受、家庭經驗與現實選擇，看見重複模式，重新選擇自己的位置。">
<title>Family Explore｜家庭系統自我探索工具</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23171326'/%3E%3Ccircle cx='23' cy='25' r='9' fill='none' stroke='%23B9AFFF' stroke-width='5'/%3E%3Ccircle cx='41' cy='25' r='9' fill='none' stroke='%238877EE' stroke-width='5'/%3E%3Cpath d='M20 45c5-7 19-7 24 0' fill='none' stroke='%23F7F4FF' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{--bg:#0d0b18;--panel:#171326;--ink:#f8f6ff;--muted:#aaa5b9;--violet:#a394ff;--line:rgba(255,255,255,.11)}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"PingFang HK","Microsoft JhengHei",sans-serif;min-height:100vh}
body:before,body:after{content:"";position:fixed;border-radius:50%;pointer-events:none;z-index:0}body:before{width:42rem;height:42rem;left:-20rem;top:5rem;background:radial-gradient(circle,rgba(102,74,220,.22),transparent 68%)}body:after{width:34rem;height:34rem;right:-14rem;top:-12rem;background:radial-gradient(circle,rgba(190,155,255,.17),transparent 70%)}
header,main,footer{position:relative;z-index:1}.top{max-width:1120px;margin:auto;padding:24px 20px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;gap:12px;align-items:center}.mark{display:grid;place-items:center;width:36px;height:36px;border:1px solid rgba(185,173,255,.35);border-radius:50%;background:rgba(129,112,239,.15);color:#c9c0ff}.brand strong{font-size:14px;letter-spacing:.04em}.brand small{display:block;color:#8f899f;margin-top:3px}.reset{display:none;color:#aaa4ba;background:none;border:0;padding:10px 12px;border-radius:30px;cursor:pointer}.reset:hover{background:rgba(255,255,255,.05);color:#fff}
.shell{max-width:1120px;margin:auto;padding:40px 20px 64px;display:grid;grid-template-columns:1fr minmax(320px,512px);gap:64px;align-items:center}.eyebrow{color:#a99cff;font-size:13px;font-weight:700;letter-spacing:.14em}.intro h1{font-size:clamp(2.5rem,6vw,4.8rem);line-height:1.03;letter-spacing:-.055em;font-weight:500;margin:18px 0 0}.intro h1 span{color:#b6aaff}.intro>p{max-width:540px;color:var(--muted);font-size:17px;line-height:2;margin-top:24px}.stats{display:flex;gap:30px;margin-top:34px}.stat{min-width:80px}.stat b{font-size:24px;font-weight:500}.stat span{display:block;color:#898396;font-size:13px;margin-top:5px}.divider{width:1px;height:46px;background:var(--line)}
.card{background:rgba(23,19,38,.92);border:1px solid var(--line);border-radius:28px;padding:28px;box-shadow:0 30px 90px rgba(0,0,0,.38);backdrop-filter:blur(18px)}.progressrow{display:flex;align-items:center;gap:14px;margin-bottom:26px}.track{height:6px;flex:1;background:rgba(255,255,255,.1);border-radius:20px;overflow:hidden}.bar{height:100%;background:var(--violet);width:25%;transition:.3s}.count{font-size:12px;color:#8f899f}.stepname{font-size:12px;font-weight:700;letter-spacing:.12em;color:#9e91ef}.card h2{font-size:26px;line-height:1.3;letter-spacing:-.025em;margin:12px 0 7px}.hint{font-size:14px;line-height:1.6;color:#9892a7;margin:0 0 22px}
.choices{display:grid;gap:11px}.choices.two{grid-template-columns:1fr 1fr}.choice{position:relative;display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;padding:17px;border:1px solid var(--line);border-radius:20px;background:rgba(255,255,255,.045);color:#fff;cursor:pointer;transition:.2s}.choice:hover{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.2)}.choice.active{border-color:#9d8fff;background:#272247;box-shadow:0 14px 40px rgba(8,5,22,.28)}.radio{width:16px;height:16px;border:1px solid rgba(255,255,255,.35);border-radius:50%;margin-top:2px;flex:0 0 16px}.choice.active .radio{border:4px solid #b8aaff}.choice b{font-size:16px}.choice small{display:block;color:#b8b3ca;font-size:14px;line-height:1.5;margin-top:5px}
.actions{display:flex;justify-content:space-between;gap:12px;margin-top:24px}.btn{border:0;border-radius:30px;min-height:44px;padding:0 20px;font-weight:700;cursor:pointer}.back{background:transparent;color:#aaa4ba}.next{background:var(--violet);color:#171126}.btn:disabled{opacity:.35;cursor:not-allowed}
.result-tag{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:rgba(163,148,255,.15);color:#b9afff}.result h2{margin-top:12px}.summary{display:grid;gap:12px;margin-top:22px}.summary div{border:1px solid var(--line);background:rgba(255,255,255,.045);padding:16px;border-radius:16px}.summary div:last-child{border-color:rgba(163,148,255,.3);background:rgba(121,105,218,.1)}.summary b{font-size:12px;letter-spacing:.1em;color:#9186dc}.summary p{color:#d1ccda;line-height:1.75;margin:8px 0 0}.quote{border-left:2px solid #9e91ef;padding-left:16px;color:#aaa5b9;font-style:italic;line-height:1.75;margin:22px 0}.again{width:100%;background:var(--violet);color:#171126}
footer{max-width:1120px;margin:auto;border-top:1px solid rgba(255,5,255,.08);padding:22px 20px;color:#777184;font-size:12px;display:flex;justify-content:space-between;gap:20px}.hidden{display:none!important}
@media(max-width:800px){.shell{grid-template-columns:1fr;padding-top:18px;gap:34px}.stats{display:none}.choices.two{grid-template-columns:1fr}.intro h1{font-size:clamp(2.4rem,12vw,4rem)}.card{padding:21px}footer{flex-direction:column;gap:4px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="brand"><span class="mark">✦</span><div><strong>Family Explore</strong><small>家庭系統自我探索工具</small></div></div><button class="reset" id="reset">↻ 重新開始</button></header>
<main class="shell">
<section class="intro"><p class="eyebrow">A QUIET SPACE FOR YOURSELF</p><h1>從探索到發現<br><span>真正的我們</span></h1><p>用幾分鐘整理一個困擾你的情境，分開感受、家庭經驗與現實選擇。答案不替你下定論，只幫你把內在聲音看得更清楚。</p><div class="stats"><div class="stat"><b>4</b><span>個探索層次</span></div><i class="divider"></i><div class="stat"><b>5–8</b><span>分鐘完成</span></div><i class="divider"></i><div class="stat"><b>0</b><span>個人資料上載</span></div></div></section>
<section class="card" id="card">
<div id="question"><div class="progressrow"><div class="track"><div class="bar" id="bar"></div></div><span class="count" id="count">1 / 4</span></div><p class="stepname" id="stepname"></p><h2 id="title"></h2><p class="hint" id="hint"></p><div class="choices" id="choices"></div><div class="actions"><button class="btn back" id="back">← 上一步</button><button class="btn next" id="next" disabled>下一步 →</button></div></div>
<div class="result hidden" id="result"><span class="result-tag">✦</span><p class="stepname" style="margin-top:20px">你的探索摘要</p><h2>你正在看見一個熟悉的模式</h2><div class="summary"><div><b>01 · 觀察</b><p id="observation"></p></div><div><b>02 · 分開事實與信念</b><p id="distinction"></p></div><div><b>03 · 一個小行動</b><p id="action"></p></div></div><p class="quote">「我可以尊重過去的經驗，也可以為現在的自己，選擇一個新的位置。」</p><button class="btn again" id="again">再探索另一個主題</button></div>
</section>
</main>
<footer><span>這是自我覺察工具，不提供心理診斷或治療。</span><span>若感到持續困擾或不安全，請尋求合資格專業人士協助。</span></footer>
<script>
const data=[
{n:"第一步 · 定位",t:"此刻，你最想看清哪一個主題？",h:"不用選最嚴重的，只選最近最有感覺的一個。",o:[["金錢與接收","付出很多，卻難以安心接受回報"],["親密關係","重複遇見相似的距離、失望或責任"],["父母與家庭","想理解家中的角色、期待與未說出的感受"],["工作與價值","努力未被看見，或常懷疑自己的選擇"]]},
{n:"第二步 · 感受",t:"當事情發生，你最先感受到甚麼？",h:"先承認感受，不急着分析誰對誰錯。",o:[["委屈","我已經很努力，卻仍不被理解"],["憤怒","我的界線或需要沒有被尊重"],["害怕","擔心失去關係、安全感或機會"],["內疚","為自己選擇時，感到對不起別人"]]},
{n:"第三步 · 模式",t:"你通常會站在哪一個位置？",h:"留意這是否是你在不同關係中熟悉的位置。",o:[["過度承擔","習慣先照顧別人，把自己的需要放到最後"],["尋求認同","對方的反應，容易變成我對自我價值的判斷"],["難以設界線","明明不願意，仍怕拒絕會破壞關係"],["重複熟悉模式","在不同關係中，再次進入相似的位置"]]},
{n:"第四步 · 信念",t:"哪一句話最像你內心的規則？",h:"信念不一定是事實，只是你曾用來保護自己的方法。",o:[["只有付出才值得被愛","把被需要誤當成被愛"],["拒絕會令我失去關係","界線被理解成離開或傷害"],["別人的需要比我重要","自己的感受總要再等一等"],["沒有結果代表我沒有價值","把暫時的結果等同自己的價值"]]}
];
let step=0,answers=["","","",""];const $=id=>document.getElementById(id);
function render(){const d=data[step];$("bar").style.width=(step+1)*25+"%";$("count").textContent=(step+1)+" / 4";$("stepname").textContent=d.n;$("title").textContent=d.t;$("hint").textContent=d.h;$("choices").className="choices"+(step===0?" two":"");$("choices").innerHTML=d.o.map(x=>'<button class="choice '+(answers[step]===x[0]?"active":"")+'" data-value="'+x[0]+'"><i class="radio"></i><span><b>'+x[0]+'</b><small>'+x[1]+'</small></span></button>').join("");$("next").disabled=!answers[step];$("next").textContent=step===3?"整理我的探索 →":"下一步 →";$("back").disabled=step===0;$("reset").style.display=step?"block":"none";document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{answers[step]=b.dataset.value;render()})}
function finish(){$("question").classList.add("hidden");$("result").classList.remove("hidden");$("reset").style.display="block";$("observation").textContent='當「'+answers[0]+'」被觸發時，你可能先感到'+answers[1]+'，然後習慣進入「'+answers[2]+'」的位置。';$("distinction").textContent='「'+answers[3]+'」是一個值得被看見的內在規則，但它不等於此刻全部的事實。';$("action").textContent=answers[2]==="難以設界線"?"先用一句不解釋、不指責的話表達自己的界線。":"在下一次自動反應前，先停十秒，問自己：這次我真正願意承擔多少？"}
function reset(){step=0;answers=["","","",""];$("question").classList.remove("hidden");$("result").classList.add("hidden");render()}
$("next").onclick=()=>step<3?(step++,render()):finish();$("back").onclick=()=>{if(step){step--;render()}};$("reset").onclick=reset;$("again").onclick=reset;render();
</script>
</body></html>
